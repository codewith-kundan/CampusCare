<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints Ledger | NITR CampusCare</title>
    <meta name="description" content="View, search, filter, and track all your submitted NIT Rourkela complaints and maintenance requests.">
    <meta name="theme-color" content="#8B1E2D">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238B1E2D'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23C9A15A' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="my-complaints.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <header class="app-navbar">
        <div class="app-navbar-container">
            <a href="dashboard.html" class="navbar-brand">
                <div class="navbar-brand-logo">NIT</div>
                <div>CampusCare</div>
            </a>

            <nav class="navbar-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="my-complaints.html" class="nav-link active">My Complaints</a>
                <a href="register-complaint.html" class="nav-link">New Complaint</a>
            </nav>

            <div class="navbar-actions">
                <a href="dashboard.html" class="btn btn-ghost btn-sm">← Dashboard</a>
                <button class="mobile-nav-toggle btn btn-ghost btn-sm" aria-label="Toggle navigation menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="container py-8 my-complaints-layout">

        <div class="page-header mb-6" data-reveal style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 6px;">My Complaints</h1>
                <p class="text-muted text-sm">View, search, and track the progress of every complaint you've filed.</p>
            </div>
            <a href="register-complaint.html" class="btn btn-primary btn-sm">+ File New Complaint</a>
        </div>

        <!-- SEARCH + MULTI-FILTER BAR -->
        <div class="filter-bar mb-6" data-reveal data-reveal-delay="60">
            <div class="search-box">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" class="form-input" placeholder="Search by title, description or #ID...">
            </div>

            <div class="filters">
                <select id="statusFilter" class="form-input">
                    <option value="all">All Statuses</option>
                    <option value="Submitted">Submitted</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed / Resolved</option>
                </select>

                <select id="categoryFilter" class="form-input">
                    <option value="all">All Categories</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Mess">Mess</option>
                    <option value="Academic">Academic</option>
                    <option value="Electricity">Electricity</option>
                    <option value="Internet">Internet</option>
                    <option value="Cleanliness">Cleanliness</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Other">Other</option>
                </select>

                <select id="sortFilter" class="form-input">
                    <option value="newest">Sort: Newest</option>
                    <option value="oldest">Sort: Oldest</option>
                </select>
            </div>
        </div>

        <!-- COMPLAINTS LIST CONTAINER -->
        <div id="complaintsContainer" class="complaints-container" data-reveal data-reveal-delay="120">
            <div class="skeleton" style="height: 110px; border-radius: var(--r-md); margin-bottom: 12px;"></div>
            <div class="skeleton" style="height: 110px; border-radius: var(--r-md); margin-bottom: 12px;"></div>
            <div class="skeleton" style="height: 110px; border-radius: var(--r-md);"></div>
        </div>

    </main>

    <!-- ================= SCRIPTS ================= -->
    <script src="api-client.js" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="effects.js" defer></script>
    <script src="my-complaints.js" defer></script>

</body>
</html>
