<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | NITR CampusCare</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#8B1E2D">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238B1E2D'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23C9A15A' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="auth.css">
    <style>
        .reset-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background: var(--surface);
        }
        .recovery-status {
            display: none;
            padding: 12px 16px;
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            border-radius: var(--r-md);
            color: #92400E;
            font-size: 0.8125rem;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
        }
        .recovery-status.is-visible {
            display: flex;
        }
    </style>
</head>

<body>

    <div class="reset-wrapper">
        <div class="card" style="width: 100%; max-width: 440px; padding: 40px;">

            <a href="login.html" class="back-home" style="margin-bottom: 24px;">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Sign In
            </a>

            <div class="auth-header" style="margin-bottom: 24px;">
                <span class="welcome">Security Verification</span>
                <h2>Set New Password</h2>
                <p>Create a strong new password for your CampusCare account.</p>
            </div>

            <div class="recovery-status" id="recoveryStatus">
                <svg class="icon-sm" style="flex:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Checking recovery link authorization...</span>
            </div>

            <form id="resetForm" novalidate>

                <div class="input-group">
                    <label for="newPassword" class="form-label">New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        </span>
                        <input type="password" id="newPassword" class="form-input" placeholder="Min. 6 characters" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="Show or hide password">
                            <svg class="icon-sm eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-sm eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.59 21.59 0 0 1-2.79 3.88M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength" data-level="0">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        </span>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter new password" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetSubmit">
                    <span class="btn-label">Update Password →</span>
                </button>

                <div class="message" id="resetMessage"></div>

            </form>

        </div>
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="effects.js" defer></script>
    <script src="reset-password.js" defer></script>

</body>
</html>
